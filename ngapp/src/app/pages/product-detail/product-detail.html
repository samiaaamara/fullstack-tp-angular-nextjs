
<div class="container py-5">

  <a routerLink="/" class="btn btn-outline-primary mb-4">
    &larr; Retour au catalogue
  </a>

  <!-- Chargement -->
  <div *ngIf="loading" class="text-center py-5">
    <div
      class="spinner-border text-primary"
      role="status"
      aria-label="Chargement"
    ></div>
    <p class="mt-3">Chargement du produit...</p>
  </div>

  <!-- Erreur -->
  <div *ngIf="!loading && error" class="alert alert-danger" role="alert">
    {{ error }}
    <div class="mt-3">
      <a routerLink="/" class="btn btn-primary">
        Retour au catalogue
      </a>
    </div>
  </div>

  <!-- Détails du produit -->
  <div *ngIf="!loading && !error && product" class="card shadow-sm border-0">
    <div class="row g-0">

      <div class="col-md-5 text-center p-4">
        <img
          [src]="product.thumbnail"
          [alt]="product.title"
          class="img-fluid rounded"
          style="max-height: 350px; object-fit: contain;"
        />
      </div>

      <div class="col-md-7">
        <div class="card-body p-4 p-lg-5">

          <span class="badge bg-primary mb-3">
            {{ product.category }}
          </span>

          <h1 class="h2 card-title mb-3">
            {{ product.title }}
          </h1>

          <p class="text-muted">
            {{ product.description }}
          </p>

          <p class="fs-3 fw-bold text-primary">
            {{ product.price | currency:'USD' }}
          </p>

          <p *ngIf="product.rating !== undefined" class="mb-4">
            <span class="text-warning">&#9733;</span>
            {{ product.rating }} / 5
          </p>

          <a routerLink="/" class="btn btn-primary">
            &larr; Retour au catalogue
          </a>

        </div>
      </div>

    </div>
  </div>

</div>
