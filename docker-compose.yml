services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: shop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d shop"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./api
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://app:app@db:5432/shop?schema=public
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  ngapp:
    image: ngapp-image:latest
    restart: unless-stopped
    ports:
      - "4200:80"

  nxapp:
    image: nxapp-image:latest
    restart: unless-stopped
    ports:
      - "3000:3000"

volumes:
  pgdata:
